name: Báo lỗi
description: Báo lỗi chức năng có thể tái hiện bằng dữ liệu giả lập
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Hiện tượng
      description: Không dán token hoặc dữ liệu nhạy cảm
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Các bước tái hiện (dữ liệu giả lập)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true
