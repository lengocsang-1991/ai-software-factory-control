[project]
name = "ai-software-factory-control"
version = "1.3.1"
description = "Local-first AI Software Factory governance MVP"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "AI SOFTWARE FACTORY"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
factory-control = "factory_control.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["factory_control*"]

[tool.setuptools.package-data]
factory_control = ["static/*.html", "static/*.js", "static/*.css"]
